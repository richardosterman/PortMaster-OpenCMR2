name: Build OpenCMR2 for PortMaster

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Cross-Compiler and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Clone OpenCMR2 Source
      run: |
        git clone --recursive https://github.com/pablocpas/OpenCMR2 source
        
    - name: Configure and Build
      run: |
        cd source
        mkdir build && cd build
        
        # Konfigurera toolchain för att använda Clang riktat mot ARM64
        echo "set(CMAKE_SYSTEM_NAME Linux)" > toolchain.cmake
        echo "set(CMAKE_SYSTEM_PROCESSOR aarch64)" >> toolchain.cmake
        echo "set(CMAKE_C_COMPILER clang)" >> toolchain.cmake
        echo "set(CMAKE_C_COMPILER_TARGET aarch64-linux-gnu)" >> toolchain.cmake
        echo "set(CMAKE_CXX_COMPILER clang++)" >> toolchain.cmake
        echo "set(CMAKE_CXX_COMPILER_TARGET aarch64-linux-gnu)" >> toolchain.cmake
        
        # Kör CMake med flaggor som stänger av skrivbordsmiljöer och slår på skärmstöd för handhållna enheter
        cmake -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DSDL_UNIX_CONSOLE_BUILD=ON \
              -DSDL_X11=OFF \
              -DSDL_WAYLAND=OFF \
              -DSDL_KMSDRM=ON \
              ..
              
        make -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: opencmr2-portmaster-bin
        path: source/build/
