name: Build OpenCMR2 for PortMaster

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Cross-Compiler and Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Clone OpenCMR2 Source
      run: |
        # Här är den rättade och kompletta länken till projektet
        git clone --recursive https://github.com source
        
    - name: Configure and Build
      run: |
        cd source
        mkdir build && cd build
        
        # Vi skapar toolchain-konfigurationen direkt i GitHub Actions
        echo "set(CMAKE_SYSTEM_NAME Linux)" > toolchain.cmake
        echo "set(CMAKE_SYSTEM_PROCESSOR aarch64)" >> toolchain.cmake
        echo "set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)" >> toolchain.cmake
        echo "set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)" >> toolchain.cmake
        
        # Kör CMake med vår genererade toolchain
        cmake -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: opencmr2-portmaster-bin
        path: source/build/
